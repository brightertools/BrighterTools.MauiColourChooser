name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install pinned workloads and restore
        run: ./eng/bootstrap.ps1
      - name: Test portable maths
        run: dotnet test tests/BrighterTools.ColourMath.Tests/BrighterTools.ColourMath.Tests.csproj -c Release --no-restore
      - name: Build Windows demo
        run: dotnet build samples/ChooserDemo/ChooserDemo.csproj -f net10.0-windows10.0.19041.0 -c Release --no-restore
      - name: Compile managed Mac demo
        run: dotnet build samples/ChooserDemo/ChooserDemo.csproj -f net10.0-maccatalyst -t:Compile -p:EnableCodeSigning=false --no-restore
      - name: Pack and verify both libraries
        run: ./eng/pack.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: artifacts/nuget/**/*
          if-no-files-found: error
